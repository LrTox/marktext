name: Checkout repository
description: MarkText wrapper for actions/checkout@v4.3.1

inputs:
  fetch-depth:
    description: Number of commits to fetch (0 = full history)
    required: false
    default: '1'
  ref:
    description: Branch, tag, or SHA to checkout (defaults to current ref)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4.3.1
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
        ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
