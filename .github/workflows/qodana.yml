name: Qodana

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'packages/website/**'
      - 'packages/desktop/static/locales/**'
  push:
    branches:
      - develop
    paths-ignore:
      - '**.md'
      - 'packages/website/**'
      - 'packages/desktop/static/locales/**'

concurrency:
  group: qodana-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qodana:
    name: Qodana (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop
            directory: packages/desktop
          # noinspection SpellCheckingInspection
          - project: muya
            directory: packages/muya # noinspection SpellCheckingInspection
    permissions:
      contents: write
      pull-requests: write
      checks: write
      security-events: write
    steps:
      - name: Check out Git repository
      - uses: ./.github/actions/checkout
        with:
          fetch-depth: 0

      - name: Qodana Scan
        uses: ./.github/actions/qodana
        with:
          args: |
            --only-directory=${{ matrix.directory }}
            --config=qodana.yaml
          pr-mode: true
          post-pr-comment: ${{ matrix.project == 'desktop' }}
          use-caches: true
          artifact-name: qodana-${{ matrix.project }}
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
